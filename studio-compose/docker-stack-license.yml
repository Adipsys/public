version: '3.7'

volumes:
 studio-lic-db_vol01:
 studio-lic-web_vol01:
 #ssl-certificates_vol01:

services:
 studio-lic-db:
    image: :${PRODUCT_SOURCE}/studio-lic-db:${PRODUCT_VERSION}
    restart: always
    command: seed    
    environment:
      - XTRABACKUP_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_ROOT_HOST=%
      - NODE_ADDRESS=^10.200.*.*
      #- FAKE_HEALTHCHECK=8081
    volumes:
          - 'studio-lic-db_vol01:/var/lib/mysql/'
 studio-lic-web:
      image: ${PRODUCT_SOURCE}/studio-lic-web:${PRODUCT_VERSION}
      hostname: studio
      restart: always
      environment:
             - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
             - OPERATOR=${OPERATOR}
             - STUDIO_NAME=${STUDIO_NAME}
             - OPERATOR_SUPPORT_EMAIL=${OPERATOR_SUPPORT_EMAIL}
             - ADMIN_PASSWD=${ADMIN_PASSWD}
      ports:
              - ${WEB_IHM_PORT}:80
              - ${WEB_IHM_SSL_PORT}:443
      volumes:
          - 'studio-lic-web_vol01:/var/www/'
          - '/root/ssl_certificates/:/root/ssl_certificates/'
      depends_on:
        - "studio-lic-db"
