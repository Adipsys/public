version: '3.8'

volumes:
 dnsp_vol01:
 dnsp-conf_vol01:
 dnsp-logs_vol01:
 dnsp-uploads_vol01:
 dnsp-db_vol01:
 dnsp-dashboard_vol01:
 #ssl-certificates_vol01:
 
networks:
   traefik_default:
    name: traefik_default
    external: true
   local_stack:

services:
 dnsp-db:
    image: ${PRODUCT_SOURCE}/dnsp-ha-db:2.3.0
    command: seed
    environment:
      - XTRABACKUP_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_ROOT_HOST=%
      - NODE_ADDRESS=^10.200.*.*
      #- FAKE_HEALTHCHECK=8081
    deploy:
      replicas: 1
      placement:
             max_replicas_per_node: 1
             constraints:
                 - node.role == manager
                 #- node.hostname == 
    networks:
          - local_stack
    volumes:
          - 'dnsp-db_vol01:/var/lib/mysql/'
         
# dnsp-db:
#    image: ${PRODUCT_SOURCE}/dnsp-ha-db:2.3.0
#    command: node tasks.dnsp-db-seed,tasks.dnsp-db
#    environment:
#      - XTRABACKUP_PASSWORD=${MYSQL_ROOT_PASSWORD}
#      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
#      - MYSQL_ROOT_HOST=%
#    deploy:
#      restart_policy:
#           condition: on-failure
#           delay: 10s
#           max_attempts: 3
#           window: 300s
#      replicas: 0
#      placement:
#             max_replicas_per_node: 1
#             constraints:
#                 - node.hostname != 
#    networks:
#        - local_stack
#    volumes:
#          - 'dnsp-db_vol01:/var/lib/mysql/'

 dnsp-web:
    image: ${PRODUCT_SOURCE}/dnsp-ha-web:${PRODUCT_VERSION}
    hostname: dnsp-node1
    environment:
         - OPERATOR=${OPERATOR}
         - SERVER_NAME=${SERVER_NAME}
         - SERVER_ALIAS=${SERVER_ALIAS}
         - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
         - ADMIN_PASSWD=${ADMIN_PASSWD}
         - LICENCE_SERVER=${LICENCE_SERVER}
    deploy:
      placement:
    #          max_replicas_per_node: 1
               constraints:
                   - node.role == manager
                   #- node.hostname == 
      labels:
             - "traefik.enable=true"
             #- "traefik.http.routers.DNSP-admin-http.rule=Host(`${SERVER_NAME}`)"
             #- "traefik.http.routers.DNSP-http.rule=HostRegexp(`{host:.+}`)"
             - "traefik.http.routers.DNSP-http.rule=HostRegexp(`.+`)"
             - "traefik.http.routers.DNSP-http.priority=1"
             - "traefik.http.routers.DNSP-admin-http.entrypoints=web"
             
             - "traefik.http.routers.DNSP-admin-https.rule=Host(`${SERVER_NAME}`)"
             - "traefik.http.routers.DNSP-admin-https.entrypoints=websecure"
             - "traefik.http.routers.DNSP-admin-https.tls=true"
        #    - "traefik.http.routers.DNSP-admin-https.tls.certresolver=letsencrypt"
             
             - "traefik.http.services.DNSP.loadbalancer.server.port=80"
             - "traefik.http.services.DNSP.loadbalancer.server.scheme=http"
             - "traefik.http.services.DNSP.loadbalancer.sticky=true"
             - "traefik.http.services.DNSP.loadbalancer.sticky.cookie.name=traefik"

             #- "traefik.docker.network=traefik_default"
             - "traefik.swarm.network=traefik_default"
    networks:
           - traefik_default
           - local_stack
    volumes:
              #- 'ssl-certificates_vol01:/root/ssl_certificates/'
              - '/root/ssl_certificates/:/root/ssl_certificates/'
              - 'dnsp-conf_vol01:/etc/powerdns/'
              #- 'dnsp_vol01:/lock/'
              - 'dnsp-uploads_vol01:/var/www/dnsp/public/uploads'
    depends_on:
         - "dnsp-db"

 dnsp-recursor:
      image: ${PRODUCT_SOURCE}/dnsp-ha-recursor:${PRODUCT_VERSION}
      environment:
              - RSYSLOG_SERVER=${RSYSLOG_SERVER}
              - LUA_HOST=dnsp-db
              - LUA_PORT=3306
              - LUA_DATABASE=dnsprotect
              - LUA_USERNAME=dnsprotect
              - LUA_PASSWORD=dnsprotect
      deploy:
        replicas: 1
        placement:
                 max_replicas_per_node: 1
      ports:
              - target: 53
                published: ${DNS_PORT}
                protocol: udp
                mode: host
      networks:
          - local_stack
      volumes:
              - 'dnsp-conf_vol01:/etc/powerdns/'
              - 'dnsp-logs_vol01:/logs/'
      depends_on:
        - "dnsp-db"

 dnsp-es:
      image: ${PRODUCT_SOURCE}/dnsp-ha-es:${PRODUCT_VERSION}
      environment:
         - discovery.type=single-node
         - "ES_JAVA_OPTS=-Xms2048m -Xmx2048m"
      deploy:
        replicas: 1
        placement:
             max_replicas_per_node: 1
             #constraints:
                 #- node.hostname == 
      networks:
         - local_stack
      volumes:
        - 'dnsp-dashboard_vol01:/usr/share/elasticsearch/data'
 dnsp-ls:
      image: ${PRODUCT_SOURCE}/dnsp-ha-ls:${PRODUCT_VERSION}
      environment:
         - discovery.type=single-node
      deploy:
          replicas: 1
          placement:
              max_replicas_per_node: 1
      networks:
         - local_stack
      depends_on:
              - "dnsp-es"

 dnsp-fb:
      image: ${PRODUCT_SOURCE}/dnsp-ha-fb:${PRODUCT_VERSION}
      deploy:
          replicas: 1
          placement:
              max_replicas_per_node: 1
      volumes:
              - 'dnsp-logs_vol01:/logs/'
      networks:
         - local_stack
      depends_on:
              - "dnsp-es"
              - "dnsp-ls"