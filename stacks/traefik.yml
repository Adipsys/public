# Traefik v3 - reverse proxy commun à tous les produits Adipsys.
# A déployer EN PREMIER. Le réseau "traefik_default" est créé explicitement par cette
# stack : le nom donné à la stack dans Portainer n'a plus d'importance.
version: '3.8'

volumes:
  traefik-acme:
    name: traefik-acme

networks:
  traefik_default:
    name: traefik_default
    driver: overlay
    attachable: true

services:
  reverse-proxy:
    image: traefik:${TRAEFIK_VERSION:-v3}
    command:
      - "--api=true"
      - "--api.dashboard=true"
      - "--log.level=INFO"
      - "--providers.file.filename=/traefik/traefik.yaml"

      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"

      - "--providers.swarm=true"
      - "--providers.swarm.exposedbydefault=false"
      - "--providers.swarm.network=traefik_default"
      - "--providers.swarm.refreshseconds=15"

      - "--certificatesresolvers.letsencrypt.acme.email=support@adipsys.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"

      - "--serversTransport.insecureSkipVerify=true"
    environment:
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-}
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/acme
      - '/root/ssl_certificates/:/root/ssl_certificates/'
      - '/root/traefik/:/traefik/'
    networks:
      - traefik_default
    deploy:
      # Une instance par manager (1 sur un serveur seul, 3 sur un cluster de 3).
      mode: global
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.traefik.rule=Host(`traefik-ui.local`)"
        - "traefik.http.routers.traefik.entrypoints=web"
        - "traefik.http.routers.traefik.service=api@internal"
        - "traefik.http.middlewares.traefik-auth.basicauth.users=admin:$$2y$$10$$jOouW3T7g.TFxovQPx6kG.pxHSCMBVvSLdFF5MR8oXzALmQJMFyqe"
        - "traefik.http.routers.traefik.middlewares=traefik-auth"
        - "traefik.http.services.dummy-svc.loadbalancer.server.port=9999"
