# Adipsys Hotspot Manager - stack unifiée (Traefik)
# Prérequis : la stack "traefik" (stacks/traefik.yml) doit être déployée.
# Mise à jour : modifier PRODUCT_VERSION dans la stack Portainer.
# TLS : certificats de /root/ssl_certificates (traefik.yaml) par défaut ;
#       ajouter TLS_RESOLVER=letsencrypt à la stack pour des certificats Let's Encrypt automatiques.
# La version de la base est fixe ; pour la changer, ajouter manuellement la variable DB_VERSION à la stack.
version: '3.8'

volumes:
  hm-db_vol01:
  hm-data_vol01:
  hm-logs_vol01:

networks:
  traefik_default:
    name: traefik_default
    external: true
  local_stack:

services:
  hm-db:
    image: ${PRODUCT_SOURCE}/hm-ha-db:${DB_VERSION:-3.40.0}
    command: seed
    environment:
      - TZ=${TZ:-Europe/Paris}
      - XTRABACKUP_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_ROOT_HOST=%
      - NODE_ADDRESS=^10\.[02]
    deploy:
      replicas: 1
      placement:
        max_replicas_per_node: 1
        constraints:
          - node.role == manager
    networks:
      - local_stack
    volumes:
      - 'hm-db_vol01:/var/lib/mysql/'

  hm-web:
    image: ${PRODUCT_SOURCE}/hm-ha-web:${PRODUCT_VERSION}
    hostname: wifi-node1
    environment:
      - TZ=${TZ:-Europe/Paris}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - OPERATOR=${OPERATOR}
      - HM_SERVER_NAME=${HM_SERVER_NAME}
      - HM_URL_SUFFIX=${HM_URL_SUFFIX}
      - HOTSPOT_ALIAS1=${HOTSPOT_ALIAS1:-}
      - ADMIN_ALIAS1=${ADMIN_ALIAS1:-}
      - OPERATOR_SUPPORT_EMAIL=${OPERATOR_SUPPORT_EMAIL}
      - LICENCE_SERVER=${LICENCE_SERVER:-licences.adipsys.com}
      - RSYSLOG_SERVER=${RSYSLOG_SERVER:-}
      - REMEDIATION=yes
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-}
    deploy:
      placement:
        max_replicas_per_node: 1
        constraints:
          - node.role == manager
      labels:
        # Les noms de routeurs Traefik sont dérivés de OPERATOR et HM_SERVER_NAME
        # (plus besoin de saisir un "Traefik Name").
        - "traefik.enable=true"
        - "traefik.swarm.network=traefik_default"

        - "traefik.http.routers.hm-${OPERATOR}-${HM_SERVER_NAME}-admin-http.rule=Host(`${HM_SERVER_NAME}-admin.${HM_URL_SUFFIX}`)"
        - "traefik.http.routers.hm-${OPERATOR}-${HM_SERVER_NAME}-admin-http.entrypoints=web"
        # Administration : HTTP redirigé vers HTTPS (le portail et l'API restent en HTTP).
        - "traefik.http.routers.hm-${OPERATOR}-${HM_SERVER_NAME}-admin-http.middlewares=hm-${OPERATOR}-${HM_SERVER_NAME}-https-redirect@swarm"
        - "traefik.http.middlewares.hm-${OPERATOR}-${HM_SERVER_NAME}-https-redirect.redirectscheme.scheme=https"
        - "traefik.http.middlewares.hm-${OPERATOR}-${HM_SERVER_NAME}-https-redirect.redirectscheme.permanent=true"

        - "traefik.http.routers.hm-${OPERATOR}-${HM_SERVER_NAME}-admin-https.rule=Host(`${HM_SERVER_NAME}-admin.${HM_URL_SUFFIX}`)"
        - "traefik.http.routers.hm-${OPERATOR}-${HM_SERVER_NAME}-admin-https.entrypoints=websecure"
        - "traefik.http.routers.hm-${OPERATOR}-${HM_SERVER_NAME}-admin-https.tls=true"
        - "traefik.http.routers.hm-${OPERATOR}-${HM_SERVER_NAME}-admin-https.tls.certresolver=${TLS_RESOLVER:-}"

        - "traefik.http.routers.hm-${OPERATOR}-${HM_SERVER_NAME}-adminpc-http.rule=Host(`${HM_SERVER_NAME}.${HM_URL_SUFFIX}`) || Host(`${HM_SERVER_NAME}-api.${HM_URL_SUFFIX}`)"
        - "traefik.http.routers.hm-${OPERATOR}-${HM_SERVER_NAME}-adminpc-http.entrypoints=web"

        - "traefik.http.routers.hm-${OPERATOR}-${HM_SERVER_NAME}-adminpc-https.rule=Host(`${HM_SERVER_NAME}.${HM_URL_SUFFIX}`) || Host(`${HM_SERVER_NAME}-api.${HM_URL_SUFFIX}`)"
        - "traefik.http.routers.hm-${OPERATOR}-${HM_SERVER_NAME}-adminpc-https.entrypoints=websecure"
        - "traefik.http.routers.hm-${OPERATOR}-${HM_SERVER_NAME}-adminpc-https.tls=true"
        - "traefik.http.routers.hm-${OPERATOR}-${HM_SERVER_NAME}-adminpc-https.tls.certresolver=${TLS_RESOLVER:-}"

        - "traefik.http.services.hm-${OPERATOR}-${HM_SERVER_NAME}.loadbalancer.server.port=80"
        - "traefik.http.services.hm-${OPERATOR}-${HM_SERVER_NAME}.loadbalancer.server.scheme=http"
        - "traefik.http.services.hm-${OPERATOR}-${HM_SERVER_NAME}.loadbalancer.sticky=true"
        - "traefik.http.services.hm-${OPERATOR}-${HM_SERVER_NAME}.loadbalancer.sticky.cookie.name=traefik"
    networks:
      - traefik_default
      - local_stack
    volumes:
      - 'hm-data_vol01:/user_data/'
      - 'hm-logs_vol01:/data/logs/'
      - '/root/ssl_certificates/:/root/hm_ssl_certificates/'
    depends_on:
      - hm-db

  hm-memcached:
    # Image Adipsys (memcached 1.4.39 recompilé sur Debian à jour), versionnée avec le produit
    image: ${PRODUCT_SOURCE}/hm-memcached:${PRODUCT_VERSION}
    command: "memcached -p 11212 -U 0"
    deploy:
      placement:
        max_replicas_per_node: 1
        constraints:
          - node.role == manager
    networks:
      - local_stack
    depends_on:
      - hm-web

  hm-rsyslog:
    image: ${PRODUCT_SOURCE}/hm-rsyslog:${PRODUCT_VERSION}
    environment:
      - TZ=${TZ:-Europe/Paris}
      - RSYSLOG_SERVER=${RSYSLOG_SERVER:-}
      - RSYSLOG_ROTATE=${RSYSLOG_ROTATE:-}
    deploy:
      placement:
        max_replicas_per_node: 1
        constraints:
          - node.role == manager
    networks:
      - local_stack
    ports:
      - ${LOGHOST_PORT:-514}:514/udp
    volumes:
      - 'hm-logs_vol01:/data/logs/'

  hm-radius-v3:
    image: ${PRODUCT_SOURCE}/hm-ha-radius-v3:${PRODUCT_VERSION}
    environment:
      - TZ=${TZ:-Europe/Paris}
      - DEBUG=0
    # Vide par défaut (commande de l'image). Debug : RADIUS_COMMAND="freeradius -XXX"
    command: "${RADIUS_COMMAND:-}"
    deploy:
      placement:
        max_replicas_per_node: 1
        constraints:
          - node.role == manager
    networks:
      - local_stack
    ports:
      - target: 1812
        published: ${RADIUS_AUTH_PORT:-1812}
        protocol: udp
        mode: host
      - target: 1813
        published: ${RADIUS_ACC_PORT:-1813}
        protocol: udp
        mode: host
    depends_on:
      - hm-db
