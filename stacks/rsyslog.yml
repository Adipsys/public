# rSyslog standalone (image Hotspot Manager)
version: '3.8'

volumes:
  traffic-logs_vol01:

services:
  hm-rsyslog:
    image: ${PRODUCT_SOURCE}/hm-rsyslog:${PRODUCT_VERSION}
    environment:
      - TZ=${TZ:-Europe/Paris}
      - RSYSLOG_ROTATE=${RSYSLOG_ROTATE:-}
    ports:
      - target: 514
        published: ${RSYSLOG_PORT:-514}
        protocol: udp
        mode: host
    volumes:
      - 'traffic-logs_vol01:/data/logs/'
