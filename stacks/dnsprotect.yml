# Adipsys DNS Protect - stack unifiée (Traefik)
# Prérequis : la stack "traefik" (stacks/traefik.yml) doit être déployée.
# Mise à jour : modifier PRODUCT_VERSION dans la stack Portainer.
# TLS : certificats de /root/ssl_certificates (traefik.yaml) par défaut ;
#       ajouter TLS_RESOLVER=letsencrypt à la stack pour des certificats Let's Encrypt automatiques.
# La version de la base est fixe ; pour la changer, ajouter manuellement la variable DB_VERSION à la stack.
version: '3.8'

volumes:
  dnsp-conf_vol01:
  dnsp-logs_vol01:
  dnsp-uploads_vol01:
  dnsp-db_vol01:
  dnsp-dashboard_vol01:

networks:
  traefik_default:
    name: traefik_default
    external: true
  local_stack:

services:
  dnsp-db:
    image: ${PRODUCT_SOURCE}/dnsp-ha-db:${DB_VERSION:-2.3.0}
    command: seed
    environment:
      - XTRABACKUP_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_ROOT_HOST=%
      - NODE_ADDRESS=^10\.[02]
    deploy:
      replicas: 1
      placement:
        max_replicas_per_node: 1
        constraints:
          - node.role == manager
    networks:
      - local_stack
    volumes:
      - 'dnsp-db_vol01:/var/lib/mysql/'

  dnsp-web:
    image: ${PRODUCT_SOURCE}/dnsp-ha-web:${PRODUCT_VERSION}
    hostname: dnsp-node1
    environment:
      - OPERATOR=${OPERATOR:-}
      - SERVER_NAME=${SERVER_NAME}
      - SERVER_ALIAS=${SERVER_ALIAS:-}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - ADMIN_PASSWD=${ADMIN_PASSWD}
      - LICENCE_SERVER=${LICENCE_SERVER:-licences.adipsys.com}
    deploy:
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=traefik_default"

        # Catch-all HTTP (priorité minimale) : pages de blocage DNS.
        - "traefik.http.routers.DNSP-http.rule=HostRegexp(`.+`)"
        - "traefik.http.routers.DNSP-http.priority=1"
        - "traefik.http.routers.DNSP-http.entrypoints=web"

        # Administration : HTTP redirigé vers HTTPS (prioritaire sur le catch-all).
        - "traefik.http.routers.DNSP-admin-http.rule=Host(`${SERVER_NAME}`)"
        - "traefik.http.routers.DNSP-admin-http.entrypoints=web"
        - "traefik.http.routers.DNSP-admin-http.middlewares=DNSP-https-redirect@swarm"
        - "traefik.http.middlewares.DNSP-https-redirect.redirectscheme.scheme=https"
        - "traefik.http.middlewares.DNSP-https-redirect.redirectscheme.permanent=true"

        - "traefik.http.routers.DNSP-admin-https.rule=Host(`${SERVER_NAME}`)"
        - "traefik.http.routers.DNSP-admin-https.entrypoints=websecure"
        - "traefik.http.routers.DNSP-admin-https.tls=true"
        - "traefik.http.routers.DNSP-admin-https.tls.certresolver=${TLS_RESOLVER:-}"

        - "traefik.http.services.DNSP.loadbalancer.server.port=80"
        - "traefik.http.services.DNSP.loadbalancer.server.scheme=http"
        - "traefik.http.services.DNSP.loadbalancer.sticky=true"
        - "traefik.http.services.DNSP.loadbalancer.sticky.cookie.name=traefik"
    networks:
      - traefik_default
      - local_stack
    volumes:
      - '/root/ssl_certificates/:/root/ssl_certificates/'
      - 'dnsp-conf_vol01:/etc/powerdns/'
      - 'dnsp-uploads_vol01:/var/www/dnsp/public/uploads'
    depends_on:
      - dnsp-db

  dnsp-recursor:
    image: ${PRODUCT_SOURCE}/dnsp-ha-recursor:${PRODUCT_VERSION}
    environment:
      - RSYSLOG_SERVER=${RSYSLOG_SERVER:-}
      - LUA_HOST=dnsp-db
      - LUA_PORT=3306
      - LUA_DATABASE=dnsprotect
      - LUA_USERNAME=dnsprotect
      - LUA_PASSWORD=dnsprotect
    deploy:
      replicas: 1
      placement:
        max_replicas_per_node: 1
    ports:
      - target: 53
        published: ${DNS_PORT:-53}
        protocol: udp
        mode: host
    networks:
      - local_stack
    volumes:
      - 'dnsp-conf_vol01:/etc/powerdns/'
      - 'dnsp-logs_vol01:/logs/'
    depends_on:
      - dnsp-db

  dnsp-es:
    image: ${PRODUCT_SOURCE}/dnsp-ha-es:${PRODUCT_VERSION}
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms2048m -Xmx2048m"
    deploy:
      replicas: 1
      placement:
        max_replicas_per_node: 1
    networks:
      - local_stack
    volumes:
      - 'dnsp-dashboard_vol01:/usr/share/elasticsearch/data'

  dnsp-ls:
    image: ${PRODUCT_SOURCE}/dnsp-ha-ls:${PRODUCT_VERSION}
    environment:
      - discovery.type=single-node
    deploy:
      replicas: 1
      placement:
        max_replicas_per_node: 1
    networks:
      - local_stack
    depends_on:
      - dnsp-es

  dnsp-fb:
    image: ${PRODUCT_SOURCE}/dnsp-ha-fb:${PRODUCT_VERSION}
    deploy:
      replicas: 1
      placement:
        max_replicas_per_node: 1
    networks:
      - local_stack
    volumes:
      - 'dnsp-logs_vol01:/logs/'
    depends_on:
      - dnsp-es
      - dnsp-ls
