# Adipsys Hotspot Manager HA - stack unifiée (Traefik), utilisateurs avancés.
# Prérequis :
#   - cluster Swarm de 3 managers ;
#   - la stack "traefik" (stacks/traefik.yml) déployée ;
#   - HA_PRIMARY_NODE = hostname du nœud principal (docker node ls).
#     Il porte hm-db-seed, hm-web (admin) et hm-rsyslog ; les autres nœuds portent
#     hm-db (Galera) et hm-web-replica.
# Mise à jour : modifier PRODUCT_VERSION (et DB_VERSION si besoin) dans la stack Portainer.
version: '3.9'

volumes:
  hm-db_vol01:
  hm-data_vol01:
  hm-logs_vol01:
  hm-data_replica:
  hm-data_master:
  hm-logs_master:

networks:
  traefik_default:
    name: traefik_default
    external: true
  local_stack:

services:
  hm-db-seed:
    image: ${PRODUCT_SOURCE}/hm-ha-db:${DB_VERSION:-3.40.0}
    command: seed
    environment:
      - TZ=${TZ:-Europe/Paris}
      - XTRABACKUP_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_ROOT_HOST=%
      - NODE_ADDRESS=^10\.[02]
    deploy:
      replicas: 1
      placement:
        max_replicas_per_node: 1
        constraints:
          - node.role == manager
          - node.hostname == ${HA_PRIMARY_NODE}
    networks:
      - local_stack
    volumes:
      - 'hm-db_vol01:/var/lib/mysql/'

  hm-db:
    image: ${PRODUCT_SOURCE}/hm-ha-db:${DB_VERSION:-3.40.0}
    command: node tasks.hm-db-seed,tasks.hm-db
    environment:
      - TZ=${TZ:-Europe/Paris}
      - XTRABACKUP_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_ROOT_HOST=%
      - NODE_ADDRESS=^10\.[02]
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 300s
      # Galera : initialisation à 2 nœuds (seed + 1), puis passer HA_DB_REPLICAS à 2
      # dans la stack une fois le cluster synchronisé pour ajouter le 3e nœud.
      # La valeur reste dans la stack : les redéploiements (mises à jour) gardent 3 nœuds.
      replicas: ${HA_DB_REPLICAS:-1}
      placement:
        max_replicas_per_node: 1
        constraints:
          - node.role == manager
          - node.hostname != ${HA_PRIMARY_NODE}
    networks:
      - local_stack
    volumes:
      - 'hm-db_vol01:/var/lib/mysql/'

  hm-master:
    image: ${PRODUCT_SOURCE}/hm-ha-master:${PRODUCT_VERSION}
    hostname: wifi-master
    environment:
      - TZ=${TZ:-Europe/Paris}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - OPERATOR=${OPERATOR}
      - HM_SERVER_NAME=${HM_SERVER_NAME}
      - HM_URL_SUFFIX=${HM_URL_SUFFIX}
      - HOTSPOT_ALIAS1=${HOTSPOT_ALIAS1:-}
      - ADMIN_ALIAS1=${ADMIN_ALIAS1:-}
      - OPERATOR_SUPPORT_EMAIL=${OPERATOR_SUPPORT_EMAIL}
      - LICENCE_SERVER=${LICENCE_SERVER:-licences.adipsys.com}
      - RSYSLOG_SERVER=${RSYSLOG_SERVER:-}
      - SYMFONY_VERSION=1.5.15
    deploy:
      replicas: 1
      placement:
        max_replicas_per_node: 1
        constraints:
          - node.role == manager
    networks:
      - local_stack
    volumes:
      - 'hm-logs_master:/data/logs/'
      - 'hm-data_master:/user_data/'
    depends_on:
      - hm-db
      - hm-memcached

  # Nœud principal : interface d'administration + portail.
  hm-web:
    image: ${PRODUCT_SOURCE}/hm-ha-web:${PRODUCT_VERSION}
    hostname: wifi-node1
    environment:
      - TZ=${TZ:-Europe/Paris}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - OPERATOR=${OPERATOR}
      - HM_SERVER_NAME=${HM_SERVER_NAME}
      - HM_URL_SUFFIX=${HM_URL_SUFFIX}
      - HOTSPOT_ALIAS1=${HOTSPOT_ALIAS1:-}
      - ADMIN_ALIAS1=${ADMIN_ALIAS1:-}
      - OPERATOR_SUPPORT_EMAIL=${OPERATOR_SUPPORT_EMAIL}
      - LICENCE_SERVER=${LICENCE_SERVER:-licences.adipsys.com}
      - RSYSLOG_SERVER=${RSYSLOG_SERVER:-}
      - REMEDIATION=yes
      - HA=1
      - SYMFONY_VERSION=1.5.15
    deploy:
      replicas: 1
      placement:
        max_replicas_per_node: 1
        constraints:
          - node.role == manager
          - node.hostname == ${HA_PRIMARY_NODE}
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=traefik_default"

        - "traefik.http.routers.hm-${OPERATOR}-${HM_SERVER_NAME}-admin-http.rule=Host(`${HM_SERVER_NAME}-admin.${HM_URL_SUFFIX}`)"
        - "traefik.http.routers.hm-${OPERATOR}-${HM_SERVER_NAME}-admin-http.entrypoints=web"

        - "traefik.http.routers.hm-${OPERATOR}-${HM_SERVER_NAME}-admin-https.rule=Host(`${HM_SERVER_NAME}-admin.${HM_URL_SUFFIX}`)"
        - "traefik.http.routers.hm-${OPERATOR}-${HM_SERVER_NAME}-admin-https.entrypoints=websecure"
        - "traefik.http.routers.hm-${OPERATOR}-${HM_SERVER_NAME}-admin-https.tls=true"

        - "traefik.http.routers.hm-${OPERATOR}-${HM_SERVER_NAME}-adminpc-http.rule=Host(`${HM_SERVER_NAME}.${HM_URL_SUFFIX}`) || Host(`${HM_SERVER_NAME}-api.${HM_URL_SUFFIX}`)"
        - "traefik.http.routers.hm-${OPERATOR}-${HM_SERVER_NAME}-adminpc-http.entrypoints=web"

        - "traefik.http.routers.hm-${OPERATOR}-${HM_SERVER_NAME}-adminpc-https.rule=Host(`${HM_SERVER_NAME}.${HM_URL_SUFFIX}`) || Host(`${HM_SERVER_NAME}-api.${HM_URL_SUFFIX}`)"
        - "traefik.http.routers.hm-${OPERATOR}-${HM_SERVER_NAME}-adminpc-https.entrypoints=websecure"
        - "traefik.http.routers.hm-${OPERATOR}-${HM_SERVER_NAME}-adminpc-https.tls=true"

        - "traefik.http.services.hm-${OPERATOR}-${HM_SERVER_NAME}.loadbalancer.server.port=80"
        - "traefik.http.services.hm-${OPERATOR}-${HM_SERVER_NAME}.loadbalancer.server.scheme=http"
        - "traefik.http.services.hm-${OPERATOR}-${HM_SERVER_NAME}.loadbalancer.sticky=true"
        - "traefik.http.services.hm-${OPERATOR}-${HM_SERVER_NAME}.loadbalancer.sticky.cookie.name=traefik"
    networks:
      - traefik_default
      - local_stack
    volumes:
      - 'hm-data_vol01:/user_data/'
      - 'hm-logs_vol01:/data/logs/'
      - '/root/ssl_certificates/:/root/hm_ssl_certificates/'
    depends_on:
      - hm-db
      - hm-memcached

  # Nœuds secondaires : portail captif / API.
  hm-web-replica:
    image: ${PRODUCT_SOURCE}/hm-ha-web:${PRODUCT_VERSION}
    hostname: wifi-nodeX
    environment:
      - TZ=${TZ:-Europe/Paris}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - OPERATOR=${OPERATOR}
      - HM_SERVER_NAME=${HM_SERVER_NAME}
      - HM_URL_SUFFIX=${HM_URL_SUFFIX}
      - HOTSPOT_ALIAS1=${HOTSPOT_ALIAS1:-}
      - ADMIN_ALIAS1=${ADMIN_ALIAS1:-}
      - OPERATOR_SUPPORT_EMAIL=${OPERATOR_SUPPORT_EMAIL}
      - LICENCE_SERVER=${LICENCE_SERVER:-licences.adipsys.com}
      - RSYSLOG_SERVER=${RSYSLOG_SERVER:-}
      - SYMFONY_VERSION=1.5.15
      - REPLICA=1
    deploy:
      replicas: 2
      placement:
        max_replicas_per_node: 1
        constraints:
          - node.role == manager
          - node.hostname != ${HA_PRIMARY_NODE}
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=traefik_default"

        - "traefik.http.routers.hm-${OPERATOR}-${HM_SERVER_NAME}-pc-http.rule=Host(`${HM_SERVER_NAME}.${HM_URL_SUFFIX}`) || Host(`${HM_SERVER_NAME}-api.${HM_URL_SUFFIX}`)"
        - "traefik.http.routers.hm-${OPERATOR}-${HM_SERVER_NAME}-pc-http.entrypoints=web"

        - "traefik.http.routers.hm-${OPERATOR}-${HM_SERVER_NAME}-pc-https.rule=Host(`${HM_SERVER_NAME}.${HM_URL_SUFFIX}`) || Host(`${HM_SERVER_NAME}-api.${HM_URL_SUFFIX}`)"
        - "traefik.http.routers.hm-${OPERATOR}-${HM_SERVER_NAME}-pc-https.entrypoints=websecure"
        - "traefik.http.routers.hm-${OPERATOR}-${HM_SERVER_NAME}-pc-https.tls=true"

        - "traefik.http.services.hm-${OPERATOR}-${HM_SERVER_NAME}-replica.loadbalancer.server.port=80"
        - "traefik.http.services.hm-${OPERATOR}-${HM_SERVER_NAME}-replica.loadbalancer.server.scheme=http"
        - "traefik.http.services.hm-${OPERATOR}-${HM_SERVER_NAME}-replica.loadbalancer.sticky=true"
        - "traefik.http.services.hm-${OPERATOR}-${HM_SERVER_NAME}-replica.loadbalancer.sticky.cookie.name=traefik"
    networks:
      traefik_default:
      local_stack:
        aliases:
          - hm-web
    volumes:
      - 'hm-data_replica:/user_data/'
      - 'hm-logs_vol01:/data/logs/'
      - '/root/ssl_certificates/:/root/hm_ssl_certificates/'
    depends_on:
      - hm-db
      - hm-web

  hm-memcached:
    image: memcached:1.4.39
    command: "memcached -p 11212"
    deploy:
      placement:
        max_replicas_per_node: 1
    networks:
      - local_stack

  hm-rsyslog:
    image: ${PRODUCT_SOURCE}/hm-rsyslog:${PRODUCT_VERSION}
    environment:
      - TZ=${TZ:-Europe/Paris}
      - RSYSLOG_SERVER=${RSYSLOG_SERVER:-}
      - RSYSLOG_ROTATE=${RSYSLOG_ROTATE:-}
    deploy:
      placement:
        max_replicas_per_node: 1
        constraints:
          - node.role == manager
          - node.hostname == ${HA_PRIMARY_NODE}
    networks:
      - local_stack
    ports:
      - ${LOGHOST_PORT:-514}:514/udp
    volumes:
      - 'hm-logs_vol01:/data/logs/'

  hm-radius-v3:
    image: ${PRODUCT_SOURCE}/hm-ha-radius-v3:${PRODUCT_VERSION}
    environment:
      - TZ=${TZ:-Europe/Paris}
      - DEBUG=0
    # Vide par défaut (commande de l'image). Debug : RADIUS_COMMAND="freeradius -XXX"
    command: "${RADIUS_COMMAND:-}"
    deploy:
      replicas: 3
      placement:
        max_replicas_per_node: 1
    networks:
      - local_stack
    ports:
      - target: 1812
        published: ${RADIUS_AUTH_PORT:-1812}
        protocol: udp
        mode: host
      - target: 1813
        published: ${RADIUS_ACC_PORT:-1813}
        protocol: udp
        mode: host
    depends_on:
      - hm-db
      - hm-web
