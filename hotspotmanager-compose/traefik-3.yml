version: '3.8'

#networks:
#  traefik_default:
#    external: true
#    name: traefik_default

volumes:
  traefik-acme:
    name: traefik-acme

services:
  reverse-proxy:
    image: traefik:latest
    command:
      # Core
      - "--api=true"
      - "--api.dashboard=true"
      - "--log.level=INFO"
      - "--providers.file.filename=/traefik/traefik.yaml"

      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"

      # Swarm Provider (v3+)
      - "--providers.swarm=true"
      - "--providers.swarm.exposedbydefault=false"
      - "--providers.swarm.network=traefik_default"
      - "--providers.swarm.refreshseconds=15"

      # Let's Encrypt
      - "--certificatesresolvers.letsencrypt.acme.email=support@adipsys.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"

      # Security / Dev
      - "--serversTransport.insecureSkipVerify=true"

    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/acme

      - '/root/ssl_certificates/:/root/ssl_certificates/'
      - '/root/traefik/:/traefik/'

    #networks:
    #  - traefik_default

    deploy:
      mode: replicated
      replicas: 3
      placement:
        max_replicas_per_node: 1
        constraints:
          - node.role == manager

      labels:
        # === DASHBOARD ROUTER ===
        - "traefik.enable=true"
        - "traefik.http.routers.traefik.rule=Host(`traefik-ui.local`)"
        - "traefik.http.routers.traefik.entrypoints=web"
        - "traefik.http.routers.traefik.service=api@internal"

        # === BASIC AUTH MIDDLEWARE ===
        - "traefik.http.middlewares.traefik-auth.basicauth.users=admin:$$2y$$10$$jOouW3T7g.TFxovQPx6kG.pxHSCMBVvSLdFF5MR8oXzALmQJMFyqe"

        # === APPLY MIDDLEWARE TO ROUTER ===
        - "traefik.http.routers.traefik.middlewares=traefik-auth"

        # === PREVENT SELF-ROUTING LOOP (Optional but safe) ===
        - "traefik.http.services.dummy-svc.loadbalancer.server.port=9999"