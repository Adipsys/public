version: '3.8'

services:
  reverse-proxy:
    image: traefik:2.11.10
    command:
      - "--api=true"
      - "--api.dashboard=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      #- "--providers.file.filename=/traefik/traefik.yaml"
      - "--providers.docker.swarmMode=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=traefik_default"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # ...
      - "--certificatesResolvers.letsEncrypt.acme.email=support@adipsys.com"
      - "--certificatesResolvers.letsEncrypt.acme.storage=acme.json"
      # used during the challenge
      - "--certificatesResolvers.letsEncrypt.acme.httpChallenge.entryPoint=web"
      #- "--log.level=debug"
      - "--serverstransport.insecureskipverify=true"
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    volumes:
      # So that Traefik can listen to the Docker events
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - '/root/ssl_certificates/:/root/ssl_certificates/'
      - '/root/traefik/:/traefik/'
    deploy:
      replicas: 3
      placement:
             max_replicas_per_node: 1
             constraints:
                 - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.traefik.rule=Host(`traefik-ui.local`)"
        - "traefik.http.routers.traefik.entrypoints=web"
        - "traefik.http.routers.traefik.service=api@internal"
        # Password hash will be generated with: htpasswd -nBC 10 <username> (dollars sign must be doubled for escaping)
        - "traefik.http.middlewares.traefik-auth.basicauth.users=admin:$$2y$$10$$jOouW3T7g.TFxovQPx6kG.pxHSCMBVvSLdFF5MR8oXzALmQJMFyqe"
        - "traefik.http.services.dummy-svc.loadbalancer.server.port=9999"
        - "traefik.docker.network=traefik_default"
