global_defs {
        router_id xxx-lb #Unique name of this Load Balancer
        notification_email {
		support@adipsys.com
		jose.paredes@adipsys.com
        }
        notification_email_from noreply@adipsys.net
        smtp_server 127.0.0.1
        smtp_connect_timeout 30
}

vrrp_script chk_docker {
    script "pgrep dockerd"
    interval 5
    weight 10
}

vrrp_instance VIP_172.18.15.20 {
        state MASTER
        interface ens19
        virtual_router_id 22
        priority 190
        advert_int 5
        smtp_alert
        virtual_ipaddress {
                172.18.15.20/25
        }
        track_script {
                chk_docker
        }
}
